server {
    listen 80;
    server_name portfolio.apollof.nl;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block dotfiles (.git, .gitignore, ...) and infra/config files
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(yml|yaml|log|conf|md)$ {
        deny all;
        return 404;
    }

    # Cache static assets
    # Note: add_header in a location replaces inherited headers, so repeat security headers here
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Web app manifest (not in default mime.types on all nginx versions)
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;
}
